<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start Page</title>
<style>
  :root {
    color-scheme: dark;
    --bg1: #111827;
    --bg2: #191b22;
    --text: #f5f7fb;
    --muted: #adb4c0;
    --glass: rgba(39,42,52,.66);
    --border: rgba(255,255,255,.09);
    --shadow: 0 22px 60px rgba(0,0,0,.32);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    overflow: auto;
    background:
      radial-gradient(circle at 16% 12%, rgba(70,165,255,.34), transparent 28%),
      radial-gradient(circle at 85% 18%, rgba(124,92,255,.26), transparent 31%),
      linear-gradient(145deg, var(--bg1), var(--bg2));
  }
  main { width: min(920px, calc(100% - 44px)); margin: 0 auto; padding: 11vh 0 54px; }
  .brand { text-align: center; margin-bottom: 30px; }
  .logo {
    width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 24px;
    display: grid; place-items: center; font-size: 36px; font-weight: 800;
    color: white; background: linear-gradient(145deg, #55c8ff, #4d6bff 58%, #7958ef);
    box-shadow: 0 18px 45px rgba(65,113,245,.32);
  }
  h1 { margin: 0; font-size: clamp(34px, 5vw, 54px); letter-spacing: -.045em; }
  .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 16px; }
  .search {
    width: min(650px, 100%); margin: 0 auto 34px; display: flex; align-items: center;
    background: var(--glass); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: var(--shadow); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
  }
  .search span { padding-left: 18px; font-size: 19px; opacity: .62; }
  .search input {
    width: 100%; border: 0; outline: 0; padding: 16px 18px 16px 11px;
    background: transparent; color: var(--text); font: inherit; font-size: 16px;
  }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 16px; }
  .tile {
    text-decoration: none; color: var(--text); text-align: center; padding: 18px 10px 14px;
    border-radius: 20px; transition: transform .18s ease, background .18s ease;
  }
  .tile:hover { transform: translateY(-4px); background: rgba(255,255,255,.15); }
  .icon {
    width: 58px; height: 58px; margin: 0 auto 10px; border-radius: 17px; display: grid;
    place-items: center; color: white; font-weight: 800; font-size: 21px;
    box-shadow: 0 12px 26px rgba(0,0,0,.14);
  }
  .tile b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .c1 { background: linear-gradient(145deg,#50d2ff,#4178ff); }
  .c2 { background: linear-gradient(145deg,#6fe29c,#2da76d); }
  .c3 { background: linear-gradient(145deg,#ffa75f,#ec6d4c); }
  .c4 { background: linear-gradient(145deg,#b887ff,#7954e8); }
  .c5 { background: linear-gradient(145deg,#68717f,#252a31); }
  footer { text-align: center; color: var(--muted); margin-top: 42px; font-size: 12px; }
  @media (max-width: 720px) { .grid { grid-template-columns: repeat(3,1fr); } main { padding-top: 7vh; } }
</style>
</head>
<body>
<main>
  <section class="brand">
    <div class="logo">C</div>
    <h1>Cachy Surf</h1>
    <p class="subtitle">Fast browsing, shaped for CachyOS.</p>
  </section>

  <form class="search" action="https://www.google.com/search" method="get">
    <span>⌕</span>
    <input name="q" autocomplete="off" autofocus placeholder="Search the web">
  </form>

  <section class="grid">
    <a class="tile" href="https://cachyos.org"><span class="icon c1">C</span><b>CachyOS</b></a>
    <a class="tile" href="https://packages.cachyos.org"><span class="icon c2">PKG</span><b>Packages</b></a>
    <a class="tile" href="https://wiki.cachyos.org"><span class="icon c3">W</span><b>Wiki</b></a>
    <a class="tile" href="https://discuss.cachyos.org"><span class="icon c4">F</span><b>Forum</b></a>
    <a class="tile" href="https://github.com/CachyOS"><span class="icon c5">GH</span><b>GitHub</b></a>
  </section>
  <footer>Unofficial community project · Not affiliated with Apple or the CachyOS team</footer>
</main>
</body>
</html>
